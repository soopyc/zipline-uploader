[package]
name = "zipline-uploader"
description = "simple tool to mass upload files to zipline, supports partial/chunked uploads."
version = "0.1.0"
edition = "2024"
repository = "https://github.com/soopyc/zipline-uploader"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
colog = "1.4.0"
color-eyre = { version = "0.6.5", default-features = false, features = ["issue-url", "track-caller"] }
directories = "6.0.0"
eyre = "0.6.12"
indicatif = "0.18.2"
indicatif-log-bridge = "0.2.3"
log = "0.4.28"
magic = "0.16.7"
reqwest = { version = "0.12.24", default-features = false, features = ["http2", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.8"
